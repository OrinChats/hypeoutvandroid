# Memória: TV Box de 1 GB precisa de folga para o R8 e para o Kotlin.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Sem isto o build tenta usar C:\Users\<usuário>\.android, que pode ser somente leitura.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Plataforma contra a qual os cinco módulos compilam.
#
# Fica aqui, e não repetido em cada build.gradle.kts, para poder ser trocada sem
# tocar em código: `./gradlew assembleDebug -Phypeou.compileSdk=36`. É o que o
# workflow do GitHub Actions usa quando o runner ainda não tem a plataforma 37.
# Nenhuma API acima de 21 é usada, então compilar contra 35, 36 ou 37 dá o mesmo
# comportamento em execução.
hypeou.compileSdk=37
