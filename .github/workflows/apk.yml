name: APK

# Gera o APK do Hypeou TV no GitHub Actions.
#
# - push em main/master ou pull request: compila, roda os testes, roda o lint e
#   publica os APKs como artefato do build.
# - push de tag `v*` (ex.: v2.1.0): além disso, cria uma Release com os APKs e o
#   SHA256SUMS.
# - execução manual (workflow_dispatch): permite escolher o compileSdk, útil
#   quando o runner ainda não tem a plataforma mais nova do SDK.
#
# Credenciais são OPCIONAIS. Sem elas o build passa: o login Supabase fica
# desligado e o catálogo (público) continua funcionando; sem chave do TMDB, os
# cartões ficam sem capa — a chave pública do site já vem em `chaves.properties`.
#
# Segredos reconhecidos (Settings → Secrets and variables → Actions):
#   SUPABASE_URL        endereço do projeto Supabase
#   SUPABASE_ANON_KEY   chave anônima/publicável (NUNCA a service_role)
#   TMDB_KEY            chave do TMDB, se quiser usar a sua no lugar da pública
#   KEYSTORE_BASE64     `base64 -w0 chaves/hypeou.jks`
#   KEYSTORE_PASSWORD   senha do keystore
#   KEY_ALIAS           alias da chave
#   KEY_PASSWORD        senha da chave
#
# Sem KEYSTORE_BASE64, o APK de release sai assinado com a chave de depuração:
# instala por sideload, mas não atualiza por cima de outra assinatura.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      compile_sdk:
        description: 'compileSdk a usar (vazio = 37, com queda automática para 36)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar, testar e empacotar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # O projeto pode estar na raiz do repositório ou dentro de uma pasta (por
      # exemplo, num repositório que também tem o site). O primeiro
      # `settings.gradle.kts` encontrado até três níveis é o projeto.
      - name: Localizar o projeto
        id: projeto
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ]; then
            raiz="."
          else
            # `-print -quit` em vez de `| head -1`: sem SIGPIPE, que o `pipefail`
            # transformaria em falha do passo.
            achado=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' -print -quit)
            if [ -z "$achado" ]; then
              echo "::error::settings.gradle.kts não encontrado (raiz ou até 3 níveis abaixo)"
              exit 1
            fi
            raiz=$(dirname "$achado")
          fi

          echo "raiz=$raiz" >> "$GITHUB_OUTPUT"
          echo "projeto em: $raiz"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Nada de `android-actions/setup-android`: a v3 tenta instalar o pacote
      # "tools", que não existe mais nos cmdline-tools recentes, e o job morre em
      # "Failed to find package 'tools'" (sdkmanager sai com 1). O runner do
      # GitHub já vem com o SDK; aqui só se confirma o caminho.
      - name: Android SDK
        run: |
          set -euo pipefail

          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::Android SDK não encontrado em $sdk"
            exit 1
          fi

          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "SDK: $sdk"

      # Escolhe a plataforma: a que o projeto pede (37) ou, se ela não existir
      # nesta imagem, a mais alta que instalar (36, 35). A biblioteca mais
      # exigente — Media3 1.7.1 — pede compileSdk 35, então 35 já compila.
      # A escolha é repassada ao Gradle por `-Phypeou.compileSdk`.
      - name: Plataforma do SDK
        run: |
          set -euo pipefail
          sdk="$ANDROID_SDK_ROOT"

          # O caminho do sdkmanager muda entre imagens (cmdline-tools/latest,
          # cmdline-tools/16.0, tools/bin). Se não achar, segue sem ele.
          sdkmanager=""
          for candidato in "$sdk/cmdline-tools/latest/bin/sdkmanager" "$sdk"/cmdline-tools/*/bin/sdkmanager "$sdk/tools/bin/sdkmanager"; do
            if [ -x "$candidato" ]; then sdkmanager="$candidato"; break; fi
          done
          if [ -z "$sdkmanager" ] && command -v sdkmanager > /dev/null 2>&1; then
            sdkmanager=$(command -v sdkmanager)
          fi

          pedido="${{ inputs.compile_sdk }}"
          pedido="${pedido:-37}"
          if [ "$pedido" = "37" ]; then
            candidatos="37 37.0 36 35"
          else
            candidatos="$pedido"
          fi

          escolhido=""
          if [ -n "$sdkmanager" ]; then
            echo "sdkmanager: $sdkmanager"
            yes | "$sdkmanager" --sdk_root="$sdk" --licenses > /dev/null 2>&1 || true

            for v in $candidatos; do
              if [ -d "$sdk/platforms/android-$v" ]; then
                escolhido="${v%%.*}"
                echo "plataforma android-$v já instalada"
                break
              fi
              if "$sdkmanager" --sdk_root="$sdk" --install "platforms;android-$v" > /dev/null 2>&1; then
                escolhido="${v%%.*}"
                echo "plataforma android-$v instalada"
                break
              fi
              echo "android-$v indisponível nesta imagem, tentando a próxima"
            done

            # O AGP baixa o build-tools que precisar; a instalação explícita é
            # só para falhar cedo e acelerar.
            "$sdkmanager" --sdk_root="$sdk" --install "platform-tools" "build-tools;36.0.0" > /dev/null 2>&1 \
              || echo "::warning::build-tools 36.0.0 não instalou; o AGP resolve o resto"
          else
            echo "::warning::sdkmanager não encontrado; usando a plataforma já instalada"
          fi

          # Sem escolha explícita, pega a plataforma mais alta que já está no disco.
          if [ -z "$escolhido" ]; then
            escolhido=$(ls "$sdk/platforms" 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          fi

          if [ -z "$escolhido" ]; then
            echo "::error::nenhuma plataforma do Android SDK disponível em $sdk/platforms"
            exit 1
          fi

          echo "HYPEOU_COMPILE_SDK=$escolhido" >> "$GITHUB_ENV"
          echo "compileSdk: $escolhido"
          echo "plataformas instaladas: $(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ')"

      - name: Gradle com cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pull request só lê o cache; quem grava é o push em main.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # `local.properties` não é versionado. Aqui ele é montado no runner: o SDK
      # vem do ambiente e as credenciais, dos segredos (quando existem).
      - name: local.properties
        working-directory: ${{ steps.projeto.outputs.raiz }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          set -euo pipefail

          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            if [ -n "${SUPABASE_URL:-}" ]; then echo "SUPABASE_URL=$SUPABASE_URL"; fi
            if [ -n "${SUPABASE_ANON_KEY:-}" ]; then echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"; fi
            if [ -n "${TMDB_KEY:-}" ]; then echo "TMDB_KEY=$TMDB_KEY"; fi
          } > local.properties

          # Mostra o que entrou sem vazar valor de chave.
          sed -E 's/^(SUPABASE_ANON_KEY|TMDB_KEY)=.*/\1=***/' local.properties

      - name: Chave de assinatura
        working-directory: ${{ steps.projeto.outputs.raiz }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice::sem KEYSTORE_BASE64 — o APK de release sai assinado com a chave de depuração"
            exit 0
          fi

          mkdir -p chaves
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > chaves/hypeou.jks

          {
            echo "storeFile=chaves/hypeou.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

          echo "assinatura configurada (alias ${KEY_ALIAS})"

      # Quando algo falha no CI, o primeiro lugar onde se olha é aqui.
      - name: Diagnóstico
        working-directory: ${{ steps.projeto.outputs.raiz }}
        run: |
          set -euo pipefail
          java -version || true
          ./gradlew --version
          echo "compileSdk escolhido: $HYPEOU_COMPILE_SDK"
          echo "platforms: $(ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "--- local.properties (chaves mascaradas) ---"
          sed -E 's/^(SUPABASE_ANON_KEY|TMDB_KEY)=.*/\1=***/' local.properties || true

      - name: Testes de unidade
        working-directory: ${{ steps.projeto.outputs.raiz }}
        run: ./gradlew test --no-daemon --console=plain -Phypeou.compileSdk="$HYPEOU_COMPILE_SDK"

      # O projeto compila com lint não bloqueante (para o release local não parar
      # por aviso). Em CI, erro de lint para o build: foi um erro de lint que
      # apontou `ConcurrentHashMap.newKeySet()` (API 24) num app com minSdk 21.
      - name: Lint
        working-directory: ${{ steps.projeto.outputs.raiz }}
        run: |
          set -euo pipefail
          ./gradlew lintDebug --no-daemon --console=plain -Phypeou.compileSdk="$HYPEOU_COMPILE_SDK"
          python3 scripts/checar-lint.py

      - name: Gerar APKs
        working-directory: ${{ steps.projeto.outputs.raiz }}
        run: ./gradlew assembleRelease assembleDebug --no-daemon --console=plain -Phypeou.compileSdk="$HYPEOU_COMPILE_SDK"

      # Confere o que saiu em vez de confiar: piso de API, launcher de TV e
      # ausência de nativa são o que decide se instala num Fire TV Stick antigo.
      - name: Conferir o APK
        working-directory: ${{ steps.projeto.outputs.raiz }}
        run: |
          set -euo pipefail
          aapt2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          "$aapt2" dump badging "$apk" | grep -E "^package:|sdkVersion|targetSdkVersion|launchable-activity|leanback-launchable|native-code" || true
          ls -lh "$apk"

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: hypeou-tv-apk
          path: |
            ${{ steps.projeto.outputs.raiz }}/app/build/outputs/apk/release/*.apk
            ${{ steps.projeto.outputs.raiz }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.projeto.outputs.raiz }}/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            ${{ steps.projeto.outputs.raiz }}/*/build/reports/tests/**
            ${{ steps.projeto.outputs.raiz }}/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # Só roda quando o push é de uma tag `v*` (ex.: v2.1.0).
  publicar:
    name: Release da tag
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar os APKs do build
        uses: actions/download-artifact@v4
        with:
          name: hypeou-tv-apk
          path: apks

      - name: Calcular SHA-256
        run: |
          set -euo pipefail
          cd apks
          find . -name '*.apk' -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Criar a Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/**/*.apk
            apks/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
